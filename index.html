<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NiSa AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">N</div>

    <div class="title">
      <h1>NiSa AI</h1>
      <p>Your personal AI assistant</p>
    </div>

    <button
      class="icon-btn"
      id="settingsBtn"
      type="button"
    >
      ⚙️
    </button>

    <button
      class="icon-btn"
      id="clearBtn"
      type="button"
    >
      🗑️
    </button>
  </header>


  <!-- CHAT -->
  <main id="chat">

    <div class="welcome">
      <h2>👋 Hello! I'm NiSa AI</h2>
      <p>
        Ask me anything, upload a photo,
        or use the camera.
      </p>
    </div>

  </main>


  <!-- INPUT -->
  <section class="input-area">

    <div class="toolbar">

      <button id="cameraBtn" type="button">
        📷 Camera
      </button>

      <button id="photoBtn" type="button">
        🖼️ Photo
      </button>

      <button id="voiceBtn" type="button">
        🎤 Voice
      </button>

      <button id="webBtn" type="button">
        🌐 Web: OFF
      </button>

      <button id="studyBtn" type="button">
        📚 Study
      </button>

      <select id="mode">
        <option value="normal">Normal</option>
        <option value="simple">Simple</option>
        <option value="expert">Expert</option>
        <option value="teacher">Teacher</option>
        <option value="exam">Exam</option>
        <option value="quiz">Quiz</option>
        <option value="compare">Compare</option>
      </select>

    </div>


    <div
      id="imagePreviewBox"
      class="hidden"
    ></div>


    <div class="composer">

      <input
        id="messageInput"
        type="text"
        placeholder="Message NiSa AI..."
        autocomplete="off"
      >

      <button
        id="sendBtn"
        class="send"
        type="button"
      >
        Send
      </button>

    </div>


    <input
      id="imageInput"
      type="file"
      accept="image/*"
      capture="environment"
      class="hidden"
    >

  </section>

</div>


<!-- CAMERA PANEL -->
<div id="cameraPanel" class="panel">

  <div class="sheet">

    <h3>📷 Camera</h3>

    <video
      id="cameraVideo"
      autoplay
      playsinline
    ></video>

    <canvas
      id="cameraCanvas"
      class="hidden"
    ></canvas>

    <img
      id="cameraPreview"
      class="camera-preview hidden"
      alt="Captured photo"
    >

    <div class="sheet-row">

      <button id="captureBtn" type="button">
        📸 Capture
      </button>

      <button id="retakeBtn" type="button">
        🔄 Retake
      </button>

      <button id="useShotBtn" type="button">
        ✅ Use photo
      </button>

      <button id="closeCameraBtn" type="button">
        ✕ Close
      </button>

    </div>

  </div>

</div>


<!-- SETTINGS -->
<div id="settingsPanel" class="panel">

  <div class="sheet">

    <h3>⚙️ Settings</h3>

    <div class="sheet-row">

      <label for="themeSelect">
        Theme
      </label>

      <select id="themeSelect">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>

    </div>


    <div class="sheet-row">

      <label for="langSelect">
        Language
      </label>

      <select id="langSelect">
        <option value="auto">Auto</option>
        <option value="en">English</option>
        <option value="mr">मराठी</option>
        <option value="hi">हिन्दी</option>
      </select>

    </div>


    <div class="sheet-row">

      <button
        id="memoryBtn"
        type="button"
      >
        🧠 Manage Memory
      </button>

      <button
        id="exportBtn"
        type="button"
      >
        📥 Export Chat
      </button>

    </div>


    <div class="sheet-row">

      <button
        id="closeSettings"
        type="button"
      >
        Close
      </button>

    </div>

  </div>

</div>


<!-- MEMORY -->
<div id="memoryPanel" class="panel">

  <div class="sheet">

    <h3>🧠 User-controlled Memory</h3>

    <p class="meta">
      Stored only in this browser.
      You can edit or clear it anytime.
    </p>

    <textarea
      id="memoryText"
      rows="7"
      placeholder="Example: I prefer short answers..."
    ></textarea>

    <div class="sheet-row">

      <button
        id="saveMemoryBtn"
        type="button"
      >
        Save memory
      </button>

      <button
        id="clearMemoryBtn"
        type="button"
      >
        Clear memory
      </button>

      <button
        id="closeMemory"
        type="button"
      >
        Close
      </button>

    </div>

  </div>

</div>


<!-- STUDY -->
<div id="studyPanel" class="panel">

  <div class="sheet">

    <h3>📚 Study Tools</h3>

    <div class="sheet-row">

      <button
        data-study="teacher"
        type="button"
      >
        🧑‍🏫 Teacher Mode
      </button>

      <button
        data-study="exam"
        type="button"
      >
        📝 Exam Mode
      </button>

      <button
        data-study="quiz"
        type="button"
      >
        🧩 Quiz Mode
      </button>

      <button
        data-study="flashcards"
        type="button"
      >
        🃏 Flashcards
      </button>

    </div>


    <div class="sheet-row">

      <button
        id="startTimer"
        type="button"
      >
        ⏱️ Start 25-min timer
      </button>

      <button
        id="resetTimer"
        type="button"
      >
        Reset timer
      </button>

    </div>


    <div
      id="timer"
      class="timer"
    >
      25:00
    </div>


    <div class="sheet-row">

      <button
        id="closeStudy"
        type="button"
      >
        Close
      </button>

    </div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
