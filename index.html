<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>NiSa AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif}
body{background:#0b0f14;color:#fff}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100dvh;max-width:920px;margin:auto;display:flex;flex-direction:column;background:#0b0f14}
header{height:68px;display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid #252d36;flex:none}
.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-weight:800}
.brand{flex:1}.brand h1{font-size:19px;margin:0}.brand p{font-size:11px;color:#8994a3;margin:3px 0 0}
.icon{border:1px solid #2a3440;background:#171d24;color:#fff;border-radius:11px;padding:9px 11px}
#chat{flex:1;overflow:auto;padding:20px 16px 12px;scroll-behavior:smooth}
.welcome{padding:10px 2px 22px}.welcome h2{font-size:27px;margin:0 0 7px}.welcome p{margin:0;color:#9aa4b2}
.message{max-width:92%;margin:0 0 14px;padding:13px 14px;border-radius:17px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.message.user{margin-left:auto;background:#2563eb}.message.ai{margin-right:auto;background:#171d24;border:1px solid #29313b}
.preview{display:block;max-width:260px;max-height:220px;border-radius:13px;margin-bottom:9px;object-fit:cover}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.actions button{border:0;background:#232c37;color:#dce5f2;border-radius:9px;padding:6px 9px;font-size:12px}
.conf{font-size:10px;color:#7f8997;margin-top:7px}
.thinking{display:flex;gap:5px;padding:3px 0}.dot{width:7px;height:7px;border-radius:50%;background:#9aa4b2;animation:b 1.1s infinite}.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{border-top:1px solid #252d36;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#0b0f14}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.tools button,.tools select{white-space:nowrap;border:1px solid #29313b;background:#171d24;color:#fff;border-radius:10px;padding:8px 10px}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0;background:#151a20;color:#fff;border:1px solid #303944;border-radius:14px;padding:13px 14px;outline:none}.row input:focus{border-color:#4d8cff}
.send{border:0;background:#fff;color:#111;border-radius:14px;padding:0 18px;font-weight:800}.send:disabled{opacity:.45}
.hidden{display:none!important}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:10}.panel.open{display:flex}
.sheet{width:min(920px,100%);max-height:86dvh;overflow:auto;background:#111720;border:1px solid #29313b;border-radius:20px 20px 0 0;padding:18px}
.sheet h3{margin:0 0 14px}.sheet button{border:0;background:#202833;color:#fff;border-radius:10px;padding:9px 12px}.sheet select,.sheet textarea{width:100%;background:#151a20;color:#fff;border:1px solid #303944;border-radius:10px;padding:10px}
.sheet .line{margin:10px 0}.timer{text-align:center;font-size:42px;margin:12px}
pre{white-space:pre-wrap;overflow:auto;background:#0b0f14;padding:10px;border-radius:10px}
code{background:#0b0f14;padding:2px 5px;border-radius:5px}
@media(max-width:600px){#chat{padding:14px}.message{max-width:94%}.welcome h2{font-size:23px}.brand h1{font-size:18px}}

/* NEXT-GEN UI */
:root{--accent:#8b5cf6;--accent2:#4f46e5;--glow:rgba(139,92,246,.28)}
body{background:radial-gradient(circle at 50% -10%,#17102d 0,#0b0f14 34%,#07090d 100%)}
.app{background:transparent;max-width:1100px}
header{height:72px;background:rgba(7,9,15,.82);backdrop-filter:blur(18px);border-bottom:1px solid #252b3a}
.brand h1{font-size:20px;letter-spacing:-.3px}.brand h1:after{content:' PRO';font-size:9px;padding:3px 6px;margin-left:5px;border-radius:99px;background:linear-gradient(135deg,#8b5cf6,#2563eb);vertical-align:middle}
.icon{background:linear-gradient(180deg,#171d29,#111722);box-shadow:0 8px 25px rgba(0,0,0,.2)}
.welcome{padding:22px 4px 24px}.welcome h2{font-size:clamp(28px,5vw,42px);letter-spacing:-1.4px}.welcome h2{background:linear-gradient(90deg,#fff,#b9a3ff,#7dd3fc);-webkit-background-clip:text;color:transparent}.welcome p{font-size:14px}
.quick-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 25px}.quick-actions button{background:linear-gradient(180deg,#131a27,#0e141e);border:1px solid #293246;color:#eef2f7;border-radius:14px;padding:11px 9px;text-align:left;min-height:62px}.quick-actions b{display:block;font-size:11px}.quick-actions span{display:block;font-size:9px;color:#8f99aa;margin-top:4px}
.message{border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.12)}.message.ai{background:linear-gradient(180deg,#121925,#0e141e);border-color:#293246}.message.user{background:linear-gradient(135deg,#315fe8,#4f46e5)}
.composer{background:rgba(7,10,16,.9);backdrop-filter:blur(18px);border-top-color:#252b3a;padding-top:10px}.tools button,.tools select{background:#151c29;border-color:#2a3446}.tools button.active{background:#281746;border-color:#8b5cf6}
.row input{background:#101620;border-color:#2a3446}.send{background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:#fff;box-shadow:0 8px 22px var(--glow)}
.camera .sheet{width:min(520px,100%);border-radius:24px;background:#0d131e}.cam-stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:3/4}.cam-stage video{width:100%;height:100%;object-fit:cover}.scan-frame{position:absolute;width:78%;height:54%;border:2px solid #b18cff;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.16),0 0 28px rgba(139,92,246,.3)}.scan-frame:after{content:'ALIGN PAGE';position:absolute;top:-27px;left:0;font-size:9px;letter-spacing:1.4px;color:#d9ccff}.scan-line{position:absolute;left:5%;right:5%;height:2px;top:50%;background:#b18cff;box-shadow:0 0 16px #b18cff;animation:scanline 2s ease-in-out infinite}@keyframes scanline{0%{transform:translateY(-120px);opacity:.2}50%{opacity:1}100%{transform:translateY(120px);opacity:.2}}
.cam-modes{display:flex;gap:6px;margin-top:10px;overflow:auto}.cam-modes button{flex:1;min-width:72px;background:#151c29;color:#fff;border:1px solid #2a3446;border-radius:10px;padding:9px 7px;font-size:11px}.cam-modes button.on{background:#6d28d9;border-color:#a78bfa}.capture-btn{width:66px;height:66px;border-radius:50%;border:5px solid #fff;background:linear-gradient(135deg,#8b5cf6,#4f46e5);display:block;margin:13px auto 4px;box-shadow:0 0 28px rgba(139,92,246,.35)}
@media(max-width:700px){.quick-actions{grid-template-columns:repeat(2,1fr)}.quick-actions button:last-child{grid-column:span 2}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">N</div>
  <div class="brand"><h1>NiSa AI</h1><p>Your personal AI assistant</p></div>
  <button class="icon" onclick="openPanel('settings')">⚙️</button>
  <button class="icon" onclick="clearChat()">🗑️</button>
</header>

<main id="chat">
  <div class="welcome"><h2>👋 Hello! I'm NiSa AI</h2><p>Ask me anything, upload a photo, or use the camera.</p></div><div class="quick-actions"><button onclick="quickPrompt('Explain this topic simply and give an example.')"><b>✨ Explain</b><span>Learn step-by-step</span></button><button onclick="quickPrompt('Solve this problem step by step and show the final answer clearly.')"><b>∑ Solve</b><span>Math & Physics</span></button><button onclick="quickPrompt('Summarize this in short, useful points.')"><b>▤ Summarize</b><span>Fast revision</span></button><button onclick="quickPrompt('Quiz me on this topic one question at a time.')"><b>🧩 Quiz</b><span>Practice</span></button><button onclick="quickPrompt('Help me write or debug this code professionally.')"><b>&lt;/&gt; Code</b><span>Build & debug</span></button></div>
</main>

<section class="composer">
  <div class="tools">
    <button onclick="pickImage()">🖼️ Photo</button>
    <button onclick="openCamera()">📷 Camera</button>
    <button onclick="voiceInput()">🎤 Voice</button>
    <button onclick="openPanel('study')">📚 Study</button>
    <select id="mode"><option value="normal">Normal</option><option value="simple">Simple</option><option value="teacher">Teacher</option><option value="exam">Exam</option><option value="quiz">Quiz</option><option value="expert">Expert</option></select>
  </div>
  <div id="previewBox" class="hidden"></div>
  <div class="row">
    <input id="input" placeholder="Message NiSa AI..." autocomplete="off">
    <button class="send" id="send">Send</button>
  </div>
  <input id="file" class="hidden" type="file" accept="image/*">
</section>
</div>

<div id="camera" class="panel camera">
  <div class="sheet">
    <h3>📷 AI Camera</h3>
    <div style="font-size:11px;color:#8994a3;margin-bottom:12px">Scan a question, textbook page, diagram or board. Capture only when it is inside the frame.</div>
    <div class="cam-stage"><video id="video" autoplay playsinline></video><canvas id="canvas" class="hidden"></canvas><div class="scan-frame"><div class="scan-line"></div></div></div>
    <div class="cam-modes"><button class="on" onclick="setCamMode('scan',this)">Scan</button><button onclick="setCamMode('solve',this)">Solve</button><button onclick="setCamMode('read',this)">Read</button><button onclick="setCamMode('diagram',this)">Diagram</button></div>
    <div id="camHint" style="text-align:center;color:#8994a3;font-size:10px;margin-top:9px">Auto-guided document capture</div>
    <button class="capture-btn" onclick="capture()"></button>
    <div class="line" style="text-align:center"><button onclick="useShot()">✓ Use capture</button> <button onclick="closeCamera()">Close</button></div>
  </div>
</div>

<div id="settings" class="panel">
  <div class="sheet">
    <h3>⚙️ Settings</h3>
    <div class="line"><label>Language</label><select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="mr">मराठी</option><option value="hi">हिन्दी</option></select></div>
    <div class="line"><label>Memory</label><textarea id="memory" rows="5" placeholder="Optional preferences for NiSa AI"></textarea></div>
    <div class="line"><button onclick="saveSettings()">Save</button> <button onclick="closePanel('settings')">Close</button></div>
  </div>
</div>

<div id="study" class="panel">
  <div class="sheet">
    <h3>📚 Study Tools</h3>
    <div class="line">
      <button onclick="study('teacher')">Teacher</button>
      <button onclick="study('exam')">Exam</button>
      <button onclick="study('quiz')">Quiz</button>
    </div>
    <div id="timer" class="timer">25:00</div>
    <button onclick="startTimer()">Start</button> <button onclick="resetTimer()">Reset</button>
    <div class="line"><button onclick="closePanel('study')">Close</button></div>
  </div>
</div>

<style>
.formula{display:block;margin:10px 0;padding:9px 11px;background:#0b0f14;border:1px solid #29313b;border-radius:10px;overflow-x:auto;font-family:Georgia,serif;font-size:16px}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 3px}.frac .top{border-bottom:1px solid currentColor;padding:0 3px}.frac .bottom{padding:1px 3px 0}.mathsup{font-size:.72em;vertical-align:super}.mathsub{font-size:.72em;vertical-align:sub}
</style>
<script>
const KEY='nisa_history_v4', MEM='nisa_memory_v4';
let history=JSON.parse(localStorage.getItem(KEY)||'[]');
let selectedImage=null, cameraStream=null, captured=null, timer=1500, timerId=null, webMode=false, camMode='scan';

const chat=document.getElementById('chat'), input=document.getElementById('input'), send=document.getElementById('send');

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function mathToHtml(s){
  let x=esc(s);
  x=x.replace(/\$\$([\s\S]*?)\$\$/g,'<span class=\"formula\">$1</span>');
  x=x.replace(/\$([^$\n]+)\$/g,'<span class=\"formula\">$1</span>');
  x=x.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,'<span class=\"frac\"><span class=\"top\">$1</span><span class=\"bottom\">$2</span></span>');
  x=x.replace(/\\Omega/g,'Ω').replace(/\\times/g,'×').replace(/\\cdot/g,'·').replace(/\\leq/g,'≤').replace(/\\geq/g,'≥').replace(/\\rightarrow/g,'→').replace(/\\pi/g,'π').replace(/\\Delta/g,'Δ');
  x=x.replace(/\^\{([^{}]+)\}/g,'<sup>$1</sup>').replace(/\^([A-Za-z0-9])/g,'<sup>$1</sup>');
  x=x.replace(/_\{([^{}]+)\}/g,'<sub>$1</sub>').replace(/_([A-Za-z0-9])/g,'<sub>$1</sub>');
  return x;
}
function format(s){
  let x=mathToHtml(s);
  x=x.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>');
  x=x.replace(/^###\s*(.+)$/gm,'<h3>$1</h3>');
  x=x.replace(/^##\s*(.+)$/gm,'<h3>$1</h3>');
  x=x.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  x=x.replace(/`([^`]+)`/g,'<code>$1</code>');
  return x;
}
function save(){localStorage.setItem(KEY,JSON.stringify(history.slice(-60)))}
function add(role,text,image=null,idx=-1){
  const el=document.createElement('div');el.className='message '+role;
  if(image){const im=document.createElement('img');im.src=image;im.className='preview';el.appendChild(im)}
  const body=document.createElement('div');body.innerHTML=role==='ai'?format(text):esc(text);el.appendChild(body);
  const a=document.createElement('div');a.className='actions';
  if(role==='ai'){
    a.innerHTML='<button>📋 Copy</button><button>🔊 Read</button>';
    a.children[0].onclick=()=>navigator.clipboard?.writeText(body.innerText);
    a.children[1].onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(body.innerText))};
    el.appendChild(a);const c=document.createElement('div');c.className='conf';c.textContent='AI answer • verify important facts';el.appendChild(c);
  } else {
    const b=document.createElement('button');b.textContent='✏️ Edit';b.onclick=()=>{input.value=text;input.focus()};a.appendChild(b);el.appendChild(a);
  }
  chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
}
function render(){
  chat.innerHTML='<div class="welcome"><h2>👋 Hello! I\'m NiSa AI</h2><p>Ask me anything, upload a photo, or use the camera.</p></div>';
  history.forEach(m=>add(m.role,m.text,m.image||null));
}
function clearChat(){if(confirm('Clear this conversation?')){history=[];save();render()}}
function pickImage(){document.getElementById('file').click()}
document.getElementById('file').onchange=e=>{if(e.target.files[0])compressImage(e.target.files[0])};

function compressImage(file){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const max=1600, scale=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    selectedImage=c.toDataURL('image/jpeg',.78);showPreview();
  };im.src=r.result};r.readAsDataURL(file);
}
function showPreview(){
  const b=document.getElementById('previewBox');b.classList.remove('hidden');
  b.innerHTML='<img class="preview" src="'+selectedImage+'"><button onclick="selectedImage=null;document.getElementById(\'previewBox\').classList.add(\'hidden\')">✕ Remove</button>';
}
async function sendMessage(){
  const text=input.value.trim();
  if(!text&&!selectedImage)return;
  const image=selectedImage;
  const mode=document.getElementById('mode').value;
  const language=document.getElementById('language').value;
  const memory=localStorage.getItem(MEM)||'';
  history.push({role:'user',text:text||'Analyze this image.',image:image||null});save();
  add('user',text||'Analyze this image.',image);
  input.value='';selectedImage=null;document.getElementById('previewBox').classList.add('hidden');
  const ai=document.createElement('div');ai.className='message ai';ai.innerHTML='<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';chat.appendChild(ai);chat.scrollTop=chat.scrollHeight;send.disabled=true;
  try{
    const messages=history.slice(-16).map(m=>({role:m.role,content:m.text}));
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,image,mode,language,memory,web:webMode,messages})});
    const data=await res.json().catch(()=>({error:'Server returned invalid JSON'}));
    if(!res.ok)throw new Error(data.error||('Server error '+res.status));
    const answer=data.answer||'No answer received.';
    ai.innerHTML=format(answer);
    const a=document.createElement('div');a.className='actions';
    const cp=document.createElement('button');cp.textContent='📋 Copy';cp.onclick=()=>navigator.clipboard?.writeText(answer);
    const rd=document.createElement('button');rd.textContent='🔊 Read';rd.onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(answer))};
    a.append(cp,rd);ai.appendChild(a);
    const c=document.createElement('div');c.className='conf';c.textContent='AI answer • verify important facts';ai.appendChild(c);
    history.push({role:'assistant',text:answer});save();
  }catch(e){ai.innerHTML='<strong>❌ Error</strong><br>'+esc(e.message)}
  send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight;
}
send.onclick=sendMessage;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});

async function openCamera(){
  openPanel('camera');
  try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});document.getElementById('video').srcObject=cameraStream}
  catch(e){alert('Camera permission is unavailable. Use Photo instead.')}
}
function capture(){const v=document.getElementById('video'),c=document.getElementById('canvas'),im=document.getElementById('shot');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext('2d').drawImage(v,0,0,c.width,c.height);captured=c.toDataURL('image/jpeg',.78);im.src=captured;im.classList.remove('hidden')}
function useShot(){if(!captured)return alert('Capture a photo first.');selectedImage=captured;showPreview();closeCamera();input.value={scan:'Analyze this image carefully and extract the useful information.',solve:'Solve the problem shown in this image step by step.',read:'Read and transcribe the visible text accurately.',diagram:'Explain the diagram, labels and working clearly.'}[camMode]||'Analyze this image.'}
function closeCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}closePanel('camera')}
function voiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Voice input is not supported here.');
  const r=new SR();const l=document.getElementById('language').value;r.lang=l==='mr'?'mr-IN':l==='hi'?'hi-IN':'en-IN';r.onresult=e=>input.value=e.results[0][0].transcript;r.start();
}
function openPanel(id){document.getElementById(id).classList.add('open');if(id==='settings')document.getElementById('memory').value=localStorage.getItem(MEM)||''}
function closePanel(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.panel').forEach(p=>p.onclick=e=>{if(e.target===p)closePanel(p.id)});
function saveSettings(){localStorage.setItem(MEM,document.getElementById('memory').value.trim());closePanel('settings')}
function study(type){closePanel('study');const p={teacher:'Teach me this topic step by step like a teacher.',exam:'Exam mode: give important questions, short answers and revision points.',quiz:'Quiz mode: ask one question at a time and wait for my answer.'};input.value=p[type];input.focus()}
function updateTimer(){document.getElementById('timer').textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}
function startTimer(){if(timerId)return;timerId=setInterval(()=>{timer--;updateTimer();if(timer<=0){clearInterval(timerId);timerId=nul
