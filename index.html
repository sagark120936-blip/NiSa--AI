<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<title>NiSa AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial,sans-serif}
body{background:#080b11;color:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;max-width:1100px;margin:auto;display:flex;flex-direction:column}
header{height:70px;display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid #242b36;background:rgba(8,11,17,.94);backdrop-filter:blur(18px);flex:none}
.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-weight:900}.brand{flex:1}
.brand h1{margin:0;font-size:20px}.brand h1 span{font-size:9px;background:#7147ff;padding:3px 6px;border-radius:99px;vertical-align:middle}.brand p{margin:3px 0 0;color:#8d98a8;font-size:11px}
.icon{border:1px solid #2b3543;background:#151b25;color:#fff;border-radius:12px;padding:9px 11px}
#chat{flex:1;overflow:auto;padding:18px 15px 14px;scroll-behavior:smooth}.welcome{padding:12px 3px 18px}
.welcome h2{font-size:clamp(28px,6vw,42px);margin:0 0 6px;background:linear-gradient(90deg,#fff,#bca9ff,#7dd3fc);-webkit-background-clip:text;color:transparent}
.welcome p{color:#98a2b2;margin:0}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 22px}
.quick button{min-height:62px;text-align:left;border:1px solid #293246;border-radius:14px;background:#111722;color:#fff;padding:10px}.quick b{display:block;font-size:11px}.quick small{display:block;color:#8b96a8;font-size:9px;margin-top:4px}
.message{max-width:92%;padding:13px 14px;margin:0 0 14px;border-radius:19px;line-height:1.55;word-break:break-word;white-space:pre-wrap;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.message.user{margin-left:auto;background:linear-gradient(135deg,#315fe8,#4f46e5)}.message.ai{margin-right:auto;background:linear-gradient(180deg,#131a25,#0f151e);border:1px solid #293246}
.preview{display:block;max-width:280px;max-height:230px;border-radius:13px;object-fit:cover;margin-bottom:9px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button,.mini{border:0;background:#232c37;color:#e7edf5;border-radius:9px;padding:6px 9px;font-size:12px}.conf{font-size:10px;color:#7f8997;margin-top:7px}
.thinking{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#aab3c0;animation:b 1.1s infinite}.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
.composer{border-top:1px solid #242b36;background:rgba(7,10,16,.96);backdrop-filter:blur(18px);padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.tools button,.tools select{white-space:nowrap;border:1px solid #293246;background:#151c29;color:#fff;border-radius:10px;padding:8px 10px}.tools .active{border-color:#8b5cf6;background:#281746}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0;background:#101620;color:#fff;border:1px solid #2a3446;border-radius:14px;padding:13px 14px;outline:none}.row input:focus{border-color:#8b5cf6}
.send{border:0;border-radius:14px;padding:0 18px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:#fff;font-weight:800}.send:disabled{opacity:.45}
.hidden{display:none!important}
.panel{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);z-index:50}.panel.open{display:flex}
.sheet{width:min(920px,100%);max-height:88dvh;overflow:auto;background:#111720;border:1px solid #293246;border-radius:22px 22px 0 0;padding:18px}.sheet h3{margin:0 0 13px}.sheet .line{margin:10px 0}.sheet button{border:0;background:#202a37;color:#fff;border-radius:10px;padding:9px 12px}.sheet select,.sheet textarea{width:100%;background:#151a22;color:#fff;border:1px solid #303a49;border-radius:10px;padding:10px}
.cam-stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:3/4;max-height:58dvh}.cam-stage video{width:100%;height:100%;object-fit:cover}.scan-frame{position:absolute;left:11%;top:20%;width:78%;height:56%;border:2px solid #b99cff;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.16)}.scan-line{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#b99cff;box-shadow:0 0 15px #b99cff;animation:scan 2s infinite ease-in-out}@keyframes scan{0%{transform:translateY(-100px);opacity:.2}50%{opacity:1}100%{transform:translateY(100px);opacity:.2}}
.cam-modes{display:flex;gap:6px;margin-top:10px;overflow:auto}.cam-modes button{flex:1;min-width:75px;font-size:11px}.cam-modes .on{background:#6d28d9;border-color:#a78bfa}.capture{display:block;width:66px;height:66px;border-radius:50%;border:5px solid #fff;background:linear-gradient(135deg,#8b5cf6,#4f46e5);margin:13px auto}
#shot{width:100%;max-height:55dvh;object-fit:contain;border-radius:15px;background:#000;margin-top:10px}.timer{text-align:center;font-size:42px;margin:12px}
.formula{display:block;background:#0b0f14;border:1px solid #293246;border-radius:10px;padding:9px;margin:9px 0;overflow:auto}.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05}.frac .top{border-bottom:1px solid currentColor;padding:0 4px}.frac .bottom{padding:2px 4px 0}
pre{white-space:pre-wrap;background:#0b0f14;padding:10px;border-radius:10px;overflow:auto}code{background:#0b0f14;padding:2px 5px;border-radius:5px}
@media(max-width:700px){.quick{grid-template-columns:repeat(2,1fr)}.quick button:last-child{grid-column:span 2}.message{max-width:95%}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">N</div><div class="brand"><h1>NiSa AI <span>PRO</span></h1><p>Your personal AI assistant</p></div>
  <button class="icon" id="settingsBtn">⚙️</button><button class="icon" id="clearBtn">🗑️</button>
</header>

<main id="chat">
  <div class="welcome"><h2>👋 Hello! I'm NiSa AI</h2><p>Ask anything, scan a question, or talk naturally.</p></div>
  <div class="quick">
    <button data-prompt="Explain this topic simply with an example."><b>✨ Explain</b><small>Step-by-step learning</small></button>
    <button data-prompt="Solve this problem step by step and show the final answer clearly."><b>∑ Solve</b><small>Math & Physics</small></button>
    <button data-prompt="Summarize this into short useful revision points."><b>▤ Summarize</b><small>Fast revision</small></button>
    <button data-prompt="Quiz me one question at a time and wait for my answer."><b>🧩 Quiz</b><small>Practice</small></button>
    <button data-prompt="Help me write or debug this code professionally."><b>&lt;/&gt; Code</b><small>Build & debug</small></button>
  </div>
</main>

<section class="composer">
  <div class="tools">
    <button id="photoBtn">🖼️ Photo</button><button id="cameraBtn">📷 AI Camera</button><button id="voiceBtn">🎤 Voice</button>
    <button id="webBtn">🌐 Web: OFF</button><button id="studyBtn">📚 Study</button>
    <select id="mode"><option value="normal">Normal</option><option value="simple">Simple</option><option value="teacher">Teacher</option><option value="exam">Exam</option><option value="quiz">Quiz</option><option value="expert">Expert</option></select>
  </div>
  <div id="previewBox" class="hidden"></div>
  <div class="row"><input id="input" placeholder="Message NiSa AI..." autocomplete="off"><button class="send" id="send">Send</button></div>
  <input id="file" class="hidden" type="file" accept="image/*">
</section>
</div>

<div id="cameraPanel" class="panel">
 <div class="sheet">
  <h3>📷 AI Camera</h3><div style="font-size:11px;color:#8d98a8;margin-bottom:10px">Place the page inside the frame, then capture.</div>
  <div class="cam-stage"><video id="video" autoplay playsinline></video><canvas id="canvas" class="hidden"></canvas><div class="scan-frame"><div class="scan-line"></div></div></div>
  <img id="shot" class="hidden" alt="Captured preview">
  <div class="cam-modes"><button class="on" data-cam="scan">Scan</button><button data-cam="solve">Solve</button><button data-cam="read">Read</button><button data-cam="diagram">Diagram</button></div>
  <div id="camHint" style="text-align:center;color:#8d98a8;font-size:10px;margin-top:8px">Scan and extract useful information</div>
  <button class="capture" id="captureBtn" aria-label="Capture"></button>
  <div class="line" style="text-align:center"><button id="useShotBtn">✓ Use capture</button> <button id="retakeBtn">↻ Retake</button> <button id="closeCameraBtn">Close</button></div>
 </div>
</div>

<div id="settingsPanel" class="panel"><div class="sheet">
 <h3>⚙️ Settings</h3>
 <div class="line"><label>Language</label><select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="mr">मराठी</option><option value="hi">हिन्दी</option></select></div>
 <div class="line"><label>Memory</label><textarea id="memory" rows="5" placeholder="Optional preferences for NiSa AI"></textarea></div>
 <div class="line"><button id="saveSettings">Save</button> <button id="closeSettings">Close</button></div>
</div></div>

<div id="studyPanel" class="panel"><div class="sheet">
 <h3>📚 Study Tools</h3><div class="line"><button data-study="teacher">🧑‍🏫 Teacher</button> <button data-study="exam">📝 Exam</button> <button data-study="quiz">🧩 Quiz</button> <button data-study="flashcards">🃏 Flashcards</button></div>
 <div id="timer" class="timer">25:00</div><div class="line"><button id="startTimer">▶ Start</button> <button id="resetTimer">↻ Reset</button></div>
 <div class="line"><button id="closeStudy">Close</button></div>
</div></div>

<script>
(() => {
'use strict';
const KEY='nisa_history_v5', MEM='nisa_memory_v5', LANG='nisa_lang_v5';
let history=[],selectedImage=null,cameraStream=null,captured=null,camMode='scan',webMode=false,timerSeconds=1500,timerId=null;
const $=id=>document.getElementById(id);
const chat=$('chat'),input=$('input'),send=$('send');

try{history=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(history))history=[]}catch{history=[]}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function format(s){
 let x=esc(s);
 x=x.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>');
 x=x.replace(/\$\$([\s\S]*?)\$\$/g,'<div class="formula">$1</div>');
 x=x.replace(/\$([^$\n]+)\$/g,'<span class="formula">$1</span>');
 x=x.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,'<span class="frac"><span class="top">$1</span><span class="bottom">$2</span></span>');
 x=x.replace(/\\(Omega|times|cdot|leq|geq|rightarrow|pi|Delta)/g,(_,m)=>({Omega:'Ω',times:'×',cdot:'·',leq:'≤',geq:'≥',rightarrow:'→',pi:'π',Delta:'Δ'}[m]));
 x=x.replace(/\^\{([^{}]+)\}/g,'<sup>$1</sup>').replace(/\^([A-Za-z0-9])/g,'<sup>$1</sup>');
 x=x.replace(/_\{([^{}]+)\}/g,'<sub>$1</sub>').replace(/_([A-Za-z0-9])/g,'<sub>$1</sub>');
 x=x.replace(/^###\s*(.+)$/gm,'<h3>$1</h3>').replace(/^##\s*(.+)$/gm,'<h3>$1</h3>');
 x=x.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
 return x;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(history.slice(-80)))}catch{}}
function add(role,text,image){
 const el=document.createElement('div');el.className='message '+role;
 if(image){const im=document.createElement('img');im.src=image;im.className='preview';el.appendChild(im)}
 const body=document.createElement('div');body.innerHTML=role==='ai'?format(text):esc(text);el.appendChild(body);
 const actions=document.createElement('div');actions.className='actions';
 if(role==='ai'){
  const cp=document.createElement('button');cp.textContent='📋 Copy';cp.onclick=()=>navigator.clipboard?.writeText(body.innerText);
  const rd=document.createElement('button');rd.textContent='🔊 Read';rd.onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(body.innerText))};
  actions.append(cp,rd);
 }else{
  const ed=document.createElement('button');ed.textContent='✏️ Edit';ed.onclick=()=>{input.value=text;input.focus()};
  actions.append(ed);
 }
 el.appendChild(actions);
 if(role==='ai'){const c=document.createElement('div');c.className='conf';c.textContent='AI answer • verify important facts';el.appendChild(c)}
 chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
}
function render(){chat.innerHTML='<div class="welcome"><h2>👋 Hello! I\'m NiSa AI</h2><p>Ask anything, scan a question, or talk naturally.</p></div>';history.forEach(m=>add(m.role,m.text,m.image||null))}
function clearChat(){if(confirm('Clear this conversation?')){history=[];save();render()}}
function openPanel(id){$(id).classList.add('open')}
function closePanel(id){$(id).classList.remove('open')}
function showPreview(){
 const b=$('previewBox');b.classList.remove('hidden');b.innerHTML='';
 const im=document.createElement('img');im.src=selectedImage;im.className='preview';b.appendChild(im);
 const rm=document.createElement('button');rm.className='mini';rm.textContent='✕ Remove photo';rm.onclick=()=>{selectedImage=null;b.classList.add('hidden');b.innerHTML=''};b.appendChild(rm);
}
function compress(file){
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);selectedImage=c.toDataURL('image/jpeg',.78);showPreview()};im.src=r.result};r.readAsDataURL(file);
}
async function sendMessage(){
 if(send.disabled)return;
 const text=input.value.trim(),image=selectedImage;
 if(!text&&!image)return;
 const mode=$('mode').value,language=$('language').value,memory=localStorage.getItem(MEM)||'';
 history.push({role:'user',text:text||'Analyze this image.',image:image||null});save();add('user',text||'Analyze this image.',image);
 input.value='';selectedImage=null;$('previewBox').classList.add('hidden');$('previewBox').innerHTML='';
 const ai=document.createElement('div');ai.className='message ai';ai.innerHTML='<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';chat.appendChild(ai);chat.scrollTop=chat.scrollHeight;send.disabled=true;
 try{
  const messages=history.slice(-18).map(m=>({role:m.role,content:m.text}));
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),45000);
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,image,mode,language,memory,web:webMode,messages}),signal:controller.signal});clearTimeout(timeout);
  const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{throw new Error('Server returned an invalid response. Check Vercel logs.')}
  if(!res.ok)throw new Error(data.error||('Server error '+res.status));
  const answer=String(data.answer||'No answer received.');
  ai.innerHTML=format(answer);
  const actions=document.createElement('div');actions.className='actions';
  const cp=document.createElement('button');cp.textContent='📋 Copy';cp.onclick=()=>navigator.clipboard?.writeText(answer);
  const rd=document.createElement('button');rd.textContent='🔊 Read';rd.onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(answer))};
  actions.append(cp,rd);ai.appendChild(actions);const c=document.createElement('div');c.className='conf';c.textContent='AI answer • verify important facts';ai.appendChild(c);
  history.push({role:'assistant',text:answer});save();
 }catch(e){ai.innerHTML='<strong>❌ Unable to reply</strong><br>'+esc(e.name==='AbortError'?'Request timed out. Please try again.':e.message)}
 send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight;
}
function voiceInput(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Voice input is not supported in this browser.');
 const r=new SR(),l=$('language').value;r.lang=l==='mr'?'mr-IN':l==='hi'?'hi-IN':'en-IN';r.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};r.onerror=()=>{};r.start();
}
async function openCamera(){
 openPanel('cameraPanel');
 try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=cameraStream}
 catch(e){alert('Camera permission unavailable. Please allow camera access or use Photo.')}
}
function capture(){
 const v=$('video'),c=$('canvas'),im=$('shot');if(!v.videoWidth)return alert('Camera is not ready yet.');
 c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);captured=c.toDataURL('image/jpeg',.78);im.src=captured;im.classList.remove('hidden');
}
function retake(){captured=null;$('shot').src='';$('shot').classList.add('hidden')}
function useCapture(){
 if(!captured)return alert('Capture a photo first.');
 selectedImage=captured;showPreview();closeCamera();
 input.value={scan:'Analyze this image carefully and extract the useful information.',solve:'Solve the problem shown in this image step by step.',read:'Read and transcribe the visible text accurately. Mark unclear words instead of guessing.',diagram:'Explain the diagram, labels, principle and working clearly.'}[camMode]||'Analyze this image.';
 input.focus();
}
function closeCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}$('video').srcObject=null;closePanel('cameraPanel')}
function setCamMode(m,btn){camMode=m;document.querySelectorAll('[data-cam]').forEach(x=>x.classList.remove('on'));btn.classList.add('on');$('camHint').textContent={scan:'Scan and extract useful information',solve:'Capture a question and solve it step by step',read:'Capture text and cleanly transcribe it',diagram:'Explain labels, structure and working'}[m]}
function setWeb(){webMode=!webMode;$('webBtn').textContent='🌐 Web: '+(webMode?'ON':'OFF');$('webBtn').classList.toggle('active',webMode)}
function studyPrompt(type){
 closePanel('studyPanel');const p={teacher:'Teach me this topic step by step like a patient teacher. Check my understanding.',exam:'Exam mode: give important points, likely questions, short answers and a revision checklist.',quiz:'Quiz mode: ask one question at a time, wait for my answer, then explain and score it.',flashcards:'Create 10 useful study flashcards from the topic I provide.'};input.value=p[type];input.focus();
}
function updateTimer(){$('timer').textContent=String(Math.floor(timerSeconds/60)).padStart(2,'0')+':'+String(timerSeconds%60).padStart(2,'0')}
function startTimer(){if(timerId)return;timerId=setInterval(()=>{timerSeconds--;updateTimer();if(timerSeconds<=0){clearInterval(timerId);timerId=null;alert('Study timer finished!')}},1000)}
function resetTimer(){clearInterval(timerId);timerId=null;timerSeconds=1500;updateTimer()}

$('send').onclick=sendMessage;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}});
$('photoBtn').onclick=()=>$('file').click();$('file').onchange=e=>{if(e.target.files[0])compress(e.target.files[0]);e.target.value=''};
$('cameraBtn').onclick=openCamera;$('voiceBtn').onclick=voiceInput;$('webBtn').onclick=setWeb;$('studyBtn').onclick=()=>openPanel('studyPanel');$('settingsBtn').onclick=()=>{$('memory').value=localStorage.getItem(MEM)||'';openPanel('settingsPanel')};$('clearBtn').onclick=clearChat;
$('captureBtn').onclick=capture;$('useShotBtn').onclick=useCapture;$('retakeBtn').onclick=retake;$('closeCameraBtn').onclick=closeCamera;
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>setCamMode(b.dataset.cam,b));
$('saveSettings').onclick=()=>{localStorage.setItem(MEM,$('memory').value.trim());localStorage.setItem(LANG,$('language').value);closePanel('settingsPanel')};
