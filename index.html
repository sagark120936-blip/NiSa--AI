<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NiSa AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0f14;
  color: white;
  height: 100vh;
}

.app {
  max-width: 850px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  padding: 16px 18px;
  border-bottom: 1px solid #252b33;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #0b0f14;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: white;
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
}

.title h1 {
  font-size: 21px;
}

.title p {
  color: #8c96a3;
  font-size: 12px;
  margin-top: 3px;
}

/* CHAT */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 85%;
  padding: 14px;
  border-radius: 16px;
  margin-bottom: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.ai {
  background: #171d24;
  border: 1px solid #252d36;
  margin-right: auto;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

/* WELCOME */
.welcome {
  margin-bottom: 25px;
}

.welcome h2 {
  font-size: 28px;
  margin-bottom: 8px;
}

.welcome p {
  color: #9aa4b2;
}

/* INPUT */
.input-area {
  padding: 14px;
  border-top: 1px solid #252b33;
  display: flex;
  gap: 10px;
  background: #0b0f14;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #303944;
  background: #151a20;
  color: white;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #4d8cff;
}

button {
  border: none;
  border-radius: 14px;
  background: white;
  color: black;
  padding: 0 20px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

button:active {
  transform: scale(0.96);
}

.clear-btn {
  background: #20262e;
  color: white;
  padding: 10px 13px;
  border-radius: 10px;
}

/* THINKING */
.thinking {
  display: flex;
  gap: 5px;
  align-items: center;
}

.dot {
  width: 7px;
  height: 7px;
  background: #9aa4b2;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}

.dot:nth-child(2) {
  animation-delay: .2s;
}

.dot:nth-child(3) {
  animation-delay: .4s;
}

@keyframes blink {
  0%, 80%, 100% {
    opacity: .25;
  }
  40% {
    opacity: 1;
  }
}

/* MOBILE */
@media (max-width: 600px) {

  .app {
    width: 100%;
  }

  #chat {
    padding: 14px;
  }

  .message {
    max-width: 92%;
  }

  .welcome h2 {
    font-size: 24px;
  }

  .input-area {
    padding: 10px;
  }

  input {
    min-width: 0;
  }

  button {
    padding: 0 16px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header>

    <div class="logo">N</div>

    <div class="title">
      <h1>NiSa AI</h1>
      <p>Your personal AI assistant</p>
    </div>

    <button class="clear-btn" onclick="clearChat()">
      Clear
    </button>

  </header>


  <div id="chat">

    <div class="welcome">
      <h2>👋 Hello! I'm NiSa AI</h2>
      <p>Ask me anything and I'll try my best to help.</p>
    </div>

    <div class="message ai">
      Hello! 👋 How can I help you today?
    </div>

  </div>


  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Message NiSa AI..."
      autocomplete="off"
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button onclick="sendMessage()" id="sendBtn">
      Send
    </button>

  </div>

</div>


<script>

async function sendMessage() {

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");
  const sendBtn = document.getElementById("sendBtn");

  const text = input.value.trim();

  if (!text) return;


  // USER MESSAGE

  const userMessage = document.createElement("div");

  userMessage.className = "message user";

  userMessage.textContent = text;

  chat.appendChild(userMessage);

  input.value = "";

  chat.scrollTop = chat.scrollHeight;


  // AI MESSAGE

  const aiMessage = document.createElement("div");

  aiMessage.className = "message ai";

  aiMessage.innerHTML = `
    <div class="thinking">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  chat.appendChild(aiMessage);

  chat.scrollTop = chat.scrollHeight;

  sendBtn.disabled = true;


  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });


    const data = await response.json();


    if (response.ok) {

      aiMessage.textContent =
        data.answer || "Sorry, I couldn't generate an answer.";

    } else {

      aiMessage.textContent =
        "Error: " + (data.error || "Something went wrong.");

    }

  }

  catch (error) {

    aiMessage.textContent =
      "Connection error. Please try again.";

  }


  sendBtn.disabled = false;

  input.focus();

  chat.scrollTop = chat.scrollHeight;

}


function clearChat() {

  const chat = document.getElementById("chat");

  chat.innerHTML = `
    <div class="welcome">
      <h2>👋 Hello! I'm NiSa AI</h2>
      <p>Ask me anything and I'll try my best to help.</p>
    </div>

    <div class="message ai">
      Chat cleared. How can I help you?
    </div>
  `;

}

</script>

</body>
</html>
