<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NiSa AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    body.light {
      background: #f4f6f8;
      color: #111;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid #252b33;
      background: #11161d;
    }

    body.light header {
      background: #fff;
      border-color: #ddd;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      border: none;
      background: #202731;
      color: white;
      border-radius: 10px;
      padding: 9px 11px;
      cursor: pointer;
      font-size: 16px;
    }

    body.light .icon-btn {
      background: #e9edf1;
      color: #111;
    }

    .settings {
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid #252b33;
    }

    .settings select,
    .settings button {
      background: #171d25;
      color: white;
      border: 1px solid #303844;
      border-radius: 9px;
      padding: 8px 10px;
      white-space: nowrap;
    }

    body.light .settings select,
    body.light .settings button {
      background: white;
      color: #111;
      border-color: #ccc;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: #18202a;
      border-bottom-left-radius: 5px;
    }

    body.light .assistant .bubble {
      background: #e9edf2;
      color: #111;
    }

    .thinking {
      opacity: .7;
      font-style: italic;
    }

    .action-card {
      margin: 8px 0 18px;
      padding: 14px;
      border: 1px solid #394452;
      border-radius: 14px;
      background: #131a22;
    }

    body.light .action-card {
      background: #fff;
      border-color: #ccc;
    }

    .action-title {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .action-description {
      margin-bottom: 12px;
      opacity: .9;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .confirm-btn,
    .cancel-btn {
      border: none;
      border-radius: 9px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .confirm-btn {
      background: #22c55e;
      color: #06120a;
    }

    .cancel-btn {
      background: #374151;
      color: white;
    }

    .input-area {
      padding: 10px;
      border-top: 1px solid #252b33;
      background: #10151b;
    }

    body.light .input-area {
      background: white;
      border-color: #ddd;
    }

    .input-row {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      resize: none;
      height: 45px;
      border: 1px solid #343c48;
      border-radius: 13px;
      padding: 12px;
      background: #171d25;
      color: white;
      outline: none;
      font-size: 15px;
    }

    body.light #messageInput {
      background: #f7f7f7;
      color: #111;
      border-color: #ccc;
    }

    .send,
    .voice,
    .camera {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 13px;
      cursor: pointer;
      font-size: 19px;
      background: #2563eb;
      color: white;
    }

    .voice {
      background: #7c3aed;
    }

    .camera {
      background: #374151;
    }

    #imageInput {
      display: none;
    }

    .preview {
      margin-top: 8px;
      display: none;
    }

    .preview img {
      max-width: 180px;
      max-height: 150px;
      border-radius: 10px;
    }

    .message-tools {
      display: flex;
      gap: 6px;
      margin-top: 7px;
    }

    .message-tools button {
      border: none;
      background: #252d38;
      color: white;
      border-radius: 7px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    body.light .message-tools button {
      background: #dfe4e9;
      color: #111;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">🤖 NiSa AI</div>

    <div class="header-buttons">
      <button class="icon-btn" id="webButton">🌐</button>
      <button class="icon-btn" id="themeButton">🌙</button>
      <button class="icon-btn" id="clearButton">🗑️</button>
    </div>
  </header>

  <div class="settings">

    <select id="modeSelect">
      <option value="normal">Normal</option>
      <option value="simple">Simple</option>
      <option value="expert">Expert</option>
      <option value="teacher">Teacher</option>
      <option value="exam">Exam</option>
      <option value="quiz">Quiz</option>
      <option value="compare">Compare</option>
    </select>

    <select id="langSelect">
      <option value="auto">Auto</option>
      <option value="marathi">Marathi</option>
      <option value="hindi">Hindi</option>
      <option value="english">English</option>
    </select>

    <button id="studyButton">📚 Study</button>

  </div>

  <main id="chat"></main>

  <div class="input-area">

    <div class="preview" id="preview">
      <img id="previewImage">
    </div>

    <div class="input-row">

      <button class="camera" id="cameraButton">📷</button>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >

      <textarea
        id="messageInput"
        placeholder="Message NiSa..."
      ></textarea>

      <button class="voice" id="voiceButton">🎤</button>

      <button class="send" id="sendButton">➤</button>

    </div>

  </div>

</div>


<script>

const chat = document.getElementById("chat");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const voiceButton = document.getElementById("voiceButton");
const cameraButton = document.getElementById("cameraButton");
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");

const modeSelect = document.getElementById("modeSelect");
const langSelect = document.getElementById("langSelect");

const themeButton = document.getElementById("themeButton");
const clearButton = document.getElementById("clearButton");
const webButton = document.getElementById("webButton");

const CHAT_KEY = "nisa_chat_v2";
const MEMORY_KEY = "nisa_memory_v2";
const THEME_KEY = "nisa_theme_v2";

let history = [];
let selectedImage = null;
let webMode = false;

try {
  history = JSON.parse(
    localStorage.getItem(CHAT_KEY) || "[]"
  );
} catch {
  history = [];
}

function saveHistory() {
  localStorage.setItem(
    CHAT_KEY,
    JSON.stringify(history)
  );
}

function getMemory() {
  return localStorage.getItem(MEMORY_KEY) || "";
}

function loadTheme() {

  const theme =
    localStorage.getItem(THEME_KEY) || "dark";

  if (theme === "light") {
    document.body.classList.add("light");
    themeButton.textContent = "☀️";
  } else {
    document.body.classList.remove("light");
    themeButton.textContent = "🌙";
  }
}

function toggleTheme() {

  document.body.classList.toggle("light");

  const light =
    document.body.classList.contains("light");

  localStorage.setItem(
    THEME_KEY,
    light ? "light" : "dark"
  );

  themeButton.textContent =
    light ? "☀️" : "🌙";
}

function toggleWeb() {

  webMode = !webMode;

  webButton.textContent =
    webMode ? "🌐 ON" : "🌐";

  webButton.style.opacity =
    webMode ? "1" : ".7";
}

function clearChat() {

  if (!confirm("Clear NiSa chat?")) {
    return;
  }

  history = [];

  localStorage.removeItem(CHAT_KEY);

  renderHistory();
}

function addMessage(role, content) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = content;

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  chat.scrollTop = chat.scrollHeight;

  return wrapper;
}

function renderHistory() {

  chat.innerHTML = "";

  if (!history.length) {

    addMessage(
      "assistant",
      "Hi 👋 Mi NiSa AI aahe. Kay help pahije?"
    );

    return;
  }

  history.forEach((msg) => {

    if (!msg || !msg.role) {
      return;
    }

    addMessage(
      msg.role === "user"
        ? "user"
        : "assistant",
      msg.content || ""
    );

    if (
      msg.role === "assistant" &&
      msg.actionPlan
    ) {
      showActionCard(msg.actionPlan);
    }

  });

  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text && !selectedImage) {
    return;
  }

  if (sendButton.disabled) {
    return;
  }

  const imageToSend = selectedImage;

  messageInput.value = "";

  selectedImage = null;

  preview.style.display = "none";
  previewImage.src = "";

  history.push({
    role: "user",
    content:
      text || "Analyze this image."
  });

  saveHistory();

  renderHistory();

  const thinking =
    addMessage(
      "assistant",
      "NiSa is thinking..."
    );

  thinking
    .querySelector(".bubble")
    .classList.add("thinking");

  sendButton.disabled = true;

  try {

    const messages =
      history.slice(-12).map(item => ({
        role: item.role,
        content: item.content
      }));

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          message:
            text ||
            "Analyze this image.",

          image: imageToSend,

          mode:
            modeSelect.value,

          language:
            langSelect.value,

          memory:
            getMemory(),

          web:
            webMode,

          messages:
            messages

        })

      });

    const raw =
      await response.text();

    let data;

    try {

      data = JSON.parse(raw);

    } catch {

      throw new Error(
        "Server returned invalid response."
      );

    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        data.details ||
        "API request failed."
      );

    }

    thinking.remove();

    const answer =
      data.answer ||
      "Sorry, answer milala nahi.";

    history.push({

      role: "assistant",

      content: answer,

      actionPlan:
        data.actionPlan || null

    });

    saveHistory();

    renderHistory();

    speakText(answer);

  } catch (error) {

    thinking.remove();

    addMessage(
      "assistant",
      "❌ Error: " +
      (error.message ||
       "Something went wrong.")
    );

  } finally {

    sendButton.disabled = false;

    messageInput.focus();

  }
}
cameraButton.addEventListener(
  "click",
  () => imageInput.click()
);

imageInput.addEventListener(
  "change",
  () => {

    const file =
      imageInput.files[0];

    if (!file) {
      return;
    }

    const reader =
      new FileReader();

    reader.onload = () => {

      selectedImage =
        reader.result;

      previewImage.src =
        selectedImage;

      preview.style.display =
        "block";

    };

    reader.readAsDataURL(file);

  }
);


/* =========================================================
   ENTER TO SEND
   ========================================================= */

messageInput.addEventListener(
  "keydown",
  (e) => {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendButton.addEventListener(
  "click",
  (e) => {

    e.preventDefault();

    sendMessage();

  }
);


/* =========================================================
   VOICE
   ========================================================= */

let recognition = null;

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "Voice recognition browser madhe supported nahi."
    );

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.onstart = () => {

    voiceButton.textContent =
      "🔴";

  };

  recognition.onresult =
    (event) => {

      const text =
        event.results[0][0].transcript;

      messageInput.value = text;

    };

  recognition.onerror = () => {

    voiceButton.textContent =
      "🎤";

  };

  recognition.onend = () => {

    voiceButton.textContent =
      "🎤";

  };

  recognition.start();
}


voiceButton.addEventListener(
  "click",
  startVoice
);


/* =========================================================
   TEXT TO SPEECH
   ========================================================= */

function speakText(text) {

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }

  try {

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    if (
      langSelect.value === "marathi"
    ) {

      utterance.lang = "mr-IN";

    } else if (
      langSelect.value === "hindi"
    ) {

      utterance.lang = "hi-IN";

    } else {

      utterance.lang = "en-IN";

    }

    speechSynthesis.speak(
      utterance
    );

  } catch {}

}


/* =========================================================
   ACTION CARD
   ========================================================= */

function showActionCard(actionPlan) {

  if (
    !actionPlan ||
    !actionPlan.action
  ) {
    return;
  }

  const card =
    document.createElement("div");

  card.className =
    "action-card";

  const title =
    document.createElement("div");

  title.className =
    "action-title";

  title.textContent =
    "⚡ NiSa Action";

  const description =
    document.createElement("div");

  description.className =
    "action-description";

  description.textContent =
    actionPlan.description ||
    "Hi action perform karaychi aahe.";

  const buttons =
    document.createElement("div");

  buttons.className =
    "action-buttons";

  const confirm =
    document.createElement("button");

  confirm.className =
    "confirm-btn";

  confirm.textContent =
    "✓ Confirm";

  const cancel =
    document.createElement("button");

  cancel.className =
    "cancel-btn";

  cancel.textContent =
    "✕ Cancel";

  buttons.appendChild(confirm);

  buttons.appendChild(cancel);

  card.appendChild(title);

  card.appendChild(description);

  card.appendChild(buttons);

  chat.appendChild(card);

  chat.scrollTop =
    chat.scrollHeight;

  confirm.addEventListener(
    "click",
    () => {

      confirmAction(
        actionPlan,
        card
      );

    }
  );

  cancel.addEventListener(
    "click",
    () => {

      card.remove();

    }
  );

}


/* =========================================================
   ANDROID BRIDGE
   ========================================================= */

function androidBridgeAvailable() {

  return (
    window.AndroidBridge &&
    typeof window.AndroidBridge ===
      "object"
  );

}


/* =========================================================
   CONFIRM ACTION
   ========================================================= */

function confirmAction(
  actionPlan,
  card
) {

  if (
    !actionPlan ||
    !actionPlan.action
  ) {
    return;
  }

  const params =
    actionPlan.params || {};


  /* TIMER */

  if (
    actionPlan.action ===
    "createTimer"
  ) {

    const seconds =
      Number(params.seconds);

    const message =
      params.message ||
      "NiSa Timer";

    if (
      !Number.isInteger(seconds) ||
      seconds <= 0
    ) {

      alert(
        "Invalid timer."
      );

      return;

    }

    if (
      androidBridgeAvailable() &&
      typeof window.AndroidBridge
        .setTimer === "function"
    ) {

      try {

        window.AndroidBridge.setTimer(
          message,
          seconds
        );

        card.innerHTML =
          "<div class='action-title'>✅ Timer request sent</div>" +
          "<div>Android Clock la timer set karanyachi request pathavli.</div>";

      } catch (error) {

        card.innerHTML =
          "<div class='action-title'>❌ Android Bridge Error</div>" +
          "<div>" +
          error.message +
          "</div>";

      }

    } else {

      card.innerHTML =
        "<div class='action-title'>📱 Android Bridge not connected</div>" +
        "<div>NiSa cha Android phone control अजून connect केलेला नाही.</div>";

    }

    return;
  }


  /* ALARM */

  if (
    actionPlan.action ===
    "setAlarm"
  ) {

    const hour =
      Number(params.hour);

    const minutes =
      Number(params.minutes);

    const message =
      params.message ||
      "NiSa Alarm";

    if (
      !Number.isInteger(hour) ||
      hour < 0 ||
      hour > 23 ||
      !Number.isInteger(minutes) ||
      minutes < 0 ||
      minutes > 59
    ) {

      alert(
        "Invalid alarm time."
      );

      return;

    }

    if (
      androidBridgeAvailable() &&
      typeof window.AndroidBridge
        .setAlarm === "function"
    ) {

      try {

        window.AndroidBridge.setAlarm(
          message,
          hour,
          minutes
        );

        card.innerHTML =
          "<div class='action-title'>✅ Alarm request sent</div>" +
          "<div>Android Clock la alarm set karanyachi request pathavli.</div>";

      } catch (error) {

        card.innerHTML =
          "<div class='action-title'>❌ Android Bridge Error</div>" +
          "<div>" +
          error.message +
          "</div>";

      }

    } else {

      card.innerHTML =
        "<div class='action-title'>📱 Android Bridge not connected</div>" +
        "<div>NiSa cha Android phone control अजून connect केलेला नाही.</div>";

    }

    return;
  }


  alert(
    "Ha action अजून supported नाही."
  );

}


/* =========================================================
   GLOBAL FUNCTIONS
   ========================================================= */

window.sendMessage =
  sendMessage;

window.startVoice =
  startVoice;

window.toggleTheme =
  toggleTheme;

window.toggleWeb =
  toggleWeb;

window.clearChat =
  clearChat;

window.confirmAction =
  confirmAction;


/* =========================================================
   BUTTONS
   ========================================================= */

themeButton.addEventListener(
  "click",
  toggleTheme
);

clearButton.addEventListener(
  "click",
  clearChat
);

webButton.addEventListener(
  "click",
  toggleWeb
);


/* =========================================================
   START
   ========================================================= */

loadTheme();

renderHistory();

messageInput.focus();

</script>

</body>
</html>
