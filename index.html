<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">My AI Assistant</div>
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">हॅलो! मी तुमचा AI असिस्टंट आहे. मी तुम्हाला कशी मदत करू?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="इथे तुमचा मेसेज टाईप करा...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <!-- ही लाईन सगळ्यात महत्त्वाची आहे, जी बाहेरच्या script.js ला जोडते -->
    <script src="script.js"></script>
</body>
</html>
