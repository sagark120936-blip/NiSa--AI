<script>
const STORAGE_CHAT = 'nisa_chat_v3';
const STORAGE_MEMORY = 'nisa_memory_v3';

let history = [];
try {
  history = JSON.parse(localStorage.getItem(STORAGE_CHAT) || '[]');
  if (!Array.isArray(history)) history = [];
} catch {
  history = [];
}

let memory = localStorage.getItem(STORAGE_MEMORY) || '';
let selectedImage = null;
let webMode = false;
let stream = null;
let capturedData = null;
let timerSeconds = 1500;
let timerId = null;
let abortController = null;

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const fileInput = document.getElementById('file');
const previewBox = document.getElementById('previewBox');

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  }[c]));
}

function formatAnswer(value) {
  let s = escapeHtml(value);

  s = s.replace(
    /```([\s\S]*?)```/g,
    '<pre>$1</pre>'
  );

  s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

  return s.replace(/\n/g, '<br>');
}

function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_CHAT,
      JSON.stringify(history.slice(-80))
    );
  } catch {}
}

function addMessage(role, text, image, index) {
  const el = document.createElement('div');
  el.className = 'message ' + role;

  if (image) {
    const img = document.createElement('img');
    img.src = image;
    img.className = 'preview';
    el.appendChild(img);
  }

  const body = document.createElement('div');
  body.className = 'message-body';

  if (role === 'ai') {
    body.innerHTML = formatAnswer(text);
  } else {
    body.textContent = text;
  }

  el.appendChild(body);

  const actions = document.createElement('div');
  actions.className = 'actions';

  if (role === 'ai') {
    actions.innerHTML = `
      <button type="button" onclick="copyText(this)">📋 Copy</button>
      <button type="button" onclick="speakText(this)">🔊 Read</button>
    `;
  } else {
    actions.innerHTML = `
      <button type="button" onclick="editMessage(${index})">
        ✏️ Edit
      </button>
    `;
  }

  el.appendChild(actions);

  if (role === 'ai') {
    const c = document.createElement('div');
    c.className = 'conf';
    c.textContent = 'AI answer • verify important facts';
    el.appendChild(c);
  }

  chat.appendChild(el);
}

function renderHistory() {
  chat.innerHTML = `
    <div class="welcome">
      <h2>👋 Hello! I'm NiSa AI</h2>
      <p>Ask me anything, upload a photo, or use the camera.</p>
    </div>
  `;

  history.forEach((m, i) => {
    addMessage(
      m.role === 'assistant' ? 'ai' : 'user',
      m.text || '',
      m.image || null,
      i
    );
  });

  chat.scrollTop = chat.scrollHeight;
}

function copyText(btn) {
  const msg = btn.closest('.message');
  const body = msg?.querySelector('.message-body');
  const text = body?.innerText || '';

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const old = btn.textContent;
      btn.textContent = '✅ Copied';

      setTimeout(() => {
        btn.textContent = old;
      }, 1000);
    }).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

function speakText(btn) {
  const body = btn.closest('.message')?.querySelector('.message-body');

  if (!body || !('speechSynthesis' in window)) {
    alert('Read-aloud is not supported here.');
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(body.innerText);
  speech.lang = getLanguage();

  speechSynthesis.speak(speech);
}

function getLanguage() {
  const language = document.getElementById('language')?.value || 'auto';

  if (language === 'mr') return 'mr-IN';
  if (language === 'hi') return 'hi-IN';

  return 'en-IN';
}

function editMessage(index) {
  const m = history[index];

  if (!m || m.role !== 'user') return;

  input.value = m.text || '';

  if (m.image) {
    selectedImage = m.image;
    showPreview(m.image);
  }

  input.focus();
}

function clearChat() {
  if (!confirm('Clear this conversation?')) return;

  history = [];
  saveHistory();
  renderHistory();
}

function setBusy(busy) {
  sendBtn.disabled = false;
  sendBtn.textContent = busy ? 'Stop' : 'Send';

  if (busy) {
    sendBtn.onclick = stopGeneration;
  } else {
    sendBtn.onclick = sendMessage;
  }
}

function stopGeneration() {
  if (abortController) {
    abortController.abort();
  }
}

function showThinking() {
  const ai = document.createElement('div');

  ai.className = 'message ai';
  ai.id = 'activeAIMessage';

  ai.innerHTML = `
    <div class="thinking">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  chat.appendChild(ai);
  chat.scrollTop = chat.scrollHeight;

  return ai;
}

async function sendMessage() {
  if (sendBtn.textContent === 'Stop') return;

  const text = input.value.trim();

  if (!text && !selectedImage) return;

  const mode =
    document.getElementById('mode')?.value || 'normal';

  const language =
    document.getElementById('language')?.value || 'auto';

  const image = selectedImage;

  history.push({
    role: 'user',
    text: text || 'Please analyze this image.',
    image: image || null
  });

  saveHistory();

  addMessage(
    'user',
    text || 'Please analyze this image.',
    image,
    history.length - 1
  );

  input.value = '';
  clearPreview();

  const aiEl = showThinking();

  sendBtn.textContent = 'Stop';
  sendBtn.onclick = stopGeneration;

  abortController = new AbortController();

  try {
    const messages = history
      .slice(-14)
      .map(m => ({
        role: m.role,
        content: String(m.text || '')
      }));

    const payload = {
      message: text || 'Analyze this image.',
      image: image || null,
      mode,
      language,
      memory,
      web: webMode,
      messages
    };

    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(payload),
      signal: abortController.signal
    });

    const raw = await response.text();

    let data = {};

    try {
      data = raw ? JSON.parse(raw) : {};
    } catch {
      throw new Error('Server returned an invalid response.');
    }

    if (!response.ok) {
      throw new Error(
        data.error || ('Server error ' + response.status)
      );
    }

    const answer = String(
      data.answer ||
      data.message ||
      data.output ||
      ''
    ).trim();

    if (!answer) {
      throw new Error('AI returned an empty answer.');
    }

    aiEl.innerHTML = `
      <div class="message-body">
        ${formatAnswer(answer)}
      </div>

      <div class="actions">
        <button type="button" onclick="copyText(this)">
          📋 Copy
        </button>

        <button type="button" onclick="speakText(this)">
          🔊 Read
        </button>
      </div>

      <div class="conf">
        AI answer • verify important facts
      </div>
    `;

    history.push({
      role: 'assistant',
      text: answer
    });

    saveHistory();

  } catch (err) {

    if (err.name === 'AbortError') {
      aiEl.innerHTML = `
        <div class="message-body">
          ⏹️ Generation stopped.
        </div>
      `;
    } else {
      aiEl.innerHTML = `
        <div class="message-body">
          ❌ ${escapeHtml(
            err.message || 'Something went wrong.'
          )}
        </div>
        <div class="conf">
          Check the API deployment and try again.
        </div>
      `;
    }

  } finally {
    abortController = null;
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
    sendBtn.onclick = sendMessage;

    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

function handleImage(file) {
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('Please select an image.');
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    selectedImage = reader.result;
    showPreview(selectedImage);
  };

  reader.onerror = () => {
    alert('Could not read this image.');
  };

  reader.readAsDataURL(file);
}

function showPreview(src) {
  previewBox.classList.remove('hidden');

  previewBox.innerHTML = `
    <img
      class="preview"
      src="${escapeHtml(src)}"
      alt="Selected photo"
    >

    <button
      type="button"
      class="mini"
      onclick="clearPreview()"
    >
      ✕ Remove photo
    </button>
  `;
}

function clearPreview() {
  selectedImage = null;

  previewBox.classList.add('hidden');
  previewBox.innerHTML = '';

  fileInput.value = '';
}

async function openCamera() {
  openPanel('cameraPanel');

  const video = document.getElementById('video');

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Camera not supported');
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: 'environment'
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play().catch(() => {});

    video.classList.remove('hidden');

  } catch {
    alert(
      'Camera permission is unavailable. You can still use Photo upload.'
    );
  }
}

function capturePhoto() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const shot = document.getElementById('shot');

  if (!video?.videoWidth) {
    alert('Camera is not ready yet.');
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext('2d');

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  capturedData = canvas.toDataURL(
    'image/jpeg',
    0.85
  );

  shot.src = capturedData;
  shot.classList.remove('hidden');

  video.classList.add('hidden');
}

function retakePhoto() {
  capturedData = null;

  document.getElementById('shot')?.classList.add('hidden');
  document.getElementById('video')?.classList.remove('hidden');
}

function useCapturedPhoto() {
  if (!capturedData) {
    alert('Capture a photo first.');
    return;
  }

  selectedImage = capturedData;

  showPreview(capturedData);
  closeCamera();

  input.focus();
}

function closeCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  closePanel('cameraPanel');
}

function startVoice() {
  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SR) {
    alert('Voice input is not supported in this browser.');
    return;
  }

  const r = new SR();

  const language =
    document.getElementById('language')?.value || 'auto';

  r.lang =
    language === 'mr'
      ? 'mr-IN'
      : language === 'hi'
      ? 'hi-IN'
      : 'en-IN';

  r.interimResults = false;
  r.maxAlternatives = 1;

  r.onresult = e => {
    input.value =
      e.results[0][0].transcript;

    input.focus();
  };

  r.onerror = e => {
    alert(
      'Voice input error: ' +
      (e.error || 'unknown')
    );
  };

  r.start();
}

function toggleWeb() {
  webMode = !webMode;

  const btn =
    document.getElementById('webBtn');

  btn.textContent =
    '🌐 Web: ' +
    (webMode ? 'ON' : 'OFF');

  btn.classList.toggle(
    'active',
    webMode
  );
}

function openPanel(id) {
  document
    .getElementById(id)
    ?.classList.add('open');
}

function closePanel(id) {
  document
    .getElementById(id)
    ?.classList.remove('open');
}

function saveSettings() {
  memory =
    document.getElementById('memory')?.value || '';

  localStorage.setItem(
    STORAGE_MEMORY,
    memory
  );

  closePanel('settingsPanel');
}

function setStudyMode(mode) {
  const modeSelect =
    document.getElementById('mode');

  if (modeSelect) {
    if (
      mode === 'teacher' ||
      mode === 'exam' ||
      mode === 'quiz'
    ) {
      modeSelect.value = mode;
    }
  }

  closePanel('studyPanel');
}

function updateTimer() {
  const timer =
    document.getElementById('timer');

  if (!timer) return;

  const min =
    String(Math.floor(timerSeconds / 60))
      .padStart(2, '0');

  const sec =
    String(timerSeconds % 60)
      .padStart(2, '0');

  timer.textContent =
    min + ':' + sec;
}

function startTimer() {
  if (timerId) return;

  timerId = setInterval(() => {
    if (timerSeconds <= 0) {
      clearInterval(timerId);
      timerId = null;
      alert('⏰ Study timer finished!');
      return;
    }

    timerSeconds--;
    updateTimer();
  }, 1000);
}

function resetTimer() {
  clearInterval(timerId);
  timerId = null;
  timerSeconds = 1500;
  updateTimer();
}

/* Buttons */

l<script>
document.addEventListener('DOMContentLoaded', () => {

  const safe = (id, event, handler) => {
    const el = document.getElementById(id);

    if (!el) {
      console.warn(`NiSa AI: #${id} not found`);
      return;
    }

    el.addEventListener(event, handler);
  };

  safe('send', 'click', sendMessage);

  safe('input', 'keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  safe('photoBtn', 'click', () => {
    fileInput?.click();
  });

  safe('file', 'change', e => {
    handleImage(e.target.files?.[0]);
  });

  safe('cameraBtn', 'click', openCamera);
  safe('captureBtn', 'click', capturePhoto);
  safe('retakeBtn', 'click', retakePhoto);
  safe('useShotBtn', 'click', useCapturedPhoto);
  safe('closeCameraBtn', 'click', closeCamera);

  safe('voiceBtn', 'click', startVoice);
  safe('webBtn', 'click', toggleWeb);

  safe('settingsBtn', 'click', () => {
    const memoryBox = document.getElementById('memory');

    if (memoryBox) {
      memoryBox.value = memory;
    }

    openPanel('settingsPanel');
  });

  safe('saveSettings', 'click', saveSettings);

  safe('closeSettings', 'click', () => {
    closePanel('settingsPanel');
  });

  safe('clearBtn', 'click', clearChat);

  safe('studyBtn', 'click', () => {
    openPanel('studyPanel');
  });

  safe('closeStudy', 'click', () => {
    closePanel('studyPanel');
  });

  safe('startTimer', 'click', startTimer);
  safe('resetTimer', 'click', resetTimer);

  document.querySelectorAll('.panel').forEach(panel => {
    panel.addEventListener('click', e => {
      if (e.target === panel) {
        closePanel(panel.id);
      }
    });
  });

  document.querySelectorAll('.quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.prompt || '';
      input.focus();
    });
  });

  document.querySelectorAll('[data-study]').forEach(btn => {
    btn.addEventListener('click', () => {
      setStudyMode(btn.dataset.study);
    });
  });

  updateTimer();
  renderHistory();

  if (input) {
    input.focus();
  }

});
</script>
