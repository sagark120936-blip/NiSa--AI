<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#0b0f14;
  --panel:#111720;
  --panel2:#171d24;
  --border:#29313b;
  --text:#fff;
  --muted:#9aa4b2;
  --accent:#4d8cff;
  --user:#2563eb;
}

body{
  background:var(--bg);
  color:var(--text);
  height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  border-radius:12px;
  cursor:pointer;
}

.app{
  max-width:900px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

header{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg);
}

.logo{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
}

.title{
  flex:1;
}

.title h1{
  font-size:20px;
}

.title p{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.icon-btn{
  background:var(--panel2);
  color:#fff;
  padding:9px 11px;
  border:1px solid var(--border);
}

/* =========================
   CHAT
========================= */

#chat{
  flex:1;
  overflow-y:auto;
  padding:18px;
}

.welcome{
  margin-bottom:22px;
}

.welcome h2{
  font-size:26px;
  margin-bottom:7px;
}

.welcome p{
  color:var(--muted);
}

.message{
  max-width:88%;
  padding:13px 14px;
  border-radius:16px;
  margin-bottom:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.ai{
  background:var(--panel2);
  border:1px solid var(--border);
  margin-right:auto;
}

.user{
  background:var(--user);
  margin-left:auto;
}

.msg-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
  flex-wrap:wrap;
}

.msg-actions button{
  background:#202833;
  color:#dce5f2;
  padding:6px 9px;
  font-size:12px;
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
}

.preview{
  max-width:220px;
  max-height:180px;
  border-radius:12px;
  margin-bottom:8px;
  display:block;
}

/* =========================
   ACTION CARD
========================= */

.action-card{
  margin-top:12px;
  margin-bottom:14px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#0d131b;
}

.action-title{
  font-weight:bold;
  margin-bottom:7px;
  font-size:16px;
}

.action-description{
  color:#dce5f2;
  font-size:14px;
  line-height:1.5;
}

.action-buttons{
  display:flex;
  gap:8px;
  margin-top:11px;
  flex-wrap:wrap;
}

.action-buttons button{
  padding:8px 13px;
  color:#fff;
}

.action-confirm{
  background:#2563eb!important;
}

.action-cancel{
  background:#3a2020!important;
}

.action-info{
  color:var(--muted);
  font-size:11px;
  margin-top:8px;
}

.action-status{
  margin-top:10px;
}

/* =========================
   INPUT
========================= */

.input-area{
  padding:10px;
  border-top:1px solid var(--border);
  background:var(--bg);
}

.toolbar{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:8px;
}

.toolbar button,
.toolbar select{
  background:var(--panel2);
  color:#fff;
  border:1px solid var(--border);
  padding:8px 9px;
  border-radius:10px;
  white-space:nowrap;
}

.composer{
  display:flex;
  gap:8px;
}

.composer input{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:14px;
  border:1px solid #303944;
  background:#151a20;
  color:#fff;
  outline:none;
}

.composer input:focus{
  border-color:var(--accent);
}

.send{
  background:#fff;
  color:#000;
  padding:0 17px;
}

.status{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:6px;
}

.hidden{
  display:none!important;
}

.typing{
  opacity:.7;
}

/* =========================
   LIGHT MODE
========================= */

body.light{
  --bg:#f5f7fa;
  --panel:#fff;
  --panel2:#eef1f5;
  --border:#d7dce3;
  --text:#111;
  --muted:#667085;
}

body.light .composer input{
  background:#fff;
  color:#111;
}

body.light .icon-btn,
body.light .toolbar button,
body.light .toolbar select,
body.light .msg-actions button{
  color:#111;
}

body.light .action-card{
  background:#fff;
}

body.light .action-description{
  color:#222;
}

</style>
</head>

<body>

<div class="app">

<header>

  <div class="logo">
    N
  </div>

  <div class="title">

    <h1>
      NiSa AI
    </h1>

    <p>
      Smart • Proactive • Personal AI
    </p>

  </div>

  <button
    class="icon-btn"
    onclick="toggleTheme()"
  >
    🌙
  </button>

  <button
    class="icon-btn"
    onclick="clearChat()"
  >
    🗑️
  </button>

</header>


<main id="chat">

  <div class="welcome">

    <h2>
      Hi, I'm NiSa 👋
    </h2>

    <p>
      Ask me anything. I'll think before I answer.
    </p>

  </div>

</main>


<div
  id="status"
  class="status hidden"
>
  NiSa is thinking...
</div>


<div class="input-area">

  <div class="toolbar">

    <button onclick="startVoice()">
      🎤 Voice
    </button>

    <button
      onclick="document.getElementById('imageInput').click()"
    >
      📷 Image
    </button>

    <button
      onclick="toggleWeb()"
      id="webBtn"
    >
      🌐 Web OFF
    </button>

    <select id="mode">

      <option value="normal">
        Normal
      </option>

      <option value="simple">
        Simple
      </option>

      <option value="expert">
        Expert
      </option>

      <option value="teacher">
        Teacher
      </option>

      <option value="exam">
        Exam
      </option>

      <option value="quiz">
        Quiz
      </option>

      <option value="compare">
        Compare
      </option>

    </select>


    <select id="langSelect">

      <option value="auto">
        Auto
      </option>

      <option value="mr">
        Marathi
      </option>

      <option value="hi">
        Hindi
      </option>

      <option value="en">
        English
      </option>

    </select>

  </div>


  <div id="imagePreview"></div>


  <div class="composer">

    <input
      id="messageInput"
      type="text"
      placeholder="Message NiSa..."
      autocomplete="off"
    >

    <button
  type="button"
  id="sendButton"
  class="send"
>
  ➤
</button>

  </div>

</div>


<input
  id="imageInput"
  type="file"
  accept="image/*"
  class="hidden"
>

</div>


<script>

/* =========================
   STORAGE
========================= */

const CHAT_KEY =
  "nisa_chat_v2";

const MEMORY_KEY =
  "nisa_memory_v2";

const THEME_KEY =
  "nisa_theme_v2";


let history = [];

let memory = "";

let webMode = false;

let selectedImage = null;


/* =========================
   LOAD
========================= */

try{

  history =
    JSON.parse(
      localStorage.getItem(CHAT_KEY) || "[]"
    );

}catch{

  history = [];

}


memory =
  localStorage.getItem(
    MEMORY_KEY
  ) || "";


const savedTheme =
  localStorage.getItem(
    THEME_KEY
  );


if(savedTheme === "light"){

  document.body.classList.add(
    "light"
  );

}


renderHistory();


/* =========================
   ENTER KEY
========================= */

/* =========================
   SEND BUTTON + ENTER
========================= */

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");


sendButton.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    sendMessage();

  }
);


messageInput.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   IMAGE
========================= */

document
  .getElementById("imageInput")
  .addEventListener(
    "change",
    async function(){

      const file =
        this.files[0];

      if(!file){
        return;
      }


      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        alert(
          "Please select an image."
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          selectedImage =
            e.target.result;


          document
            .getElementById(
              "imagePreview"
            )
            .innerHTML = `

              <img
                src="${selectedImage}"
                class="preview"
              >

            `;

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================
   THEME
========================= */

function toggleTheme(){

  document.body.classList.toggle(
    "light"
  );


  const light =
    document.body.classList.contains(
      "light"
    );


  localStorage.setItem(
    THEME_KEY,
    light
      ? "light"
      : "dark"
  );

}


/* =========================
   WEB
========================= */

function toggleWeb(){

  webMode =
    !webMode;


  document.getElementById(
    "webBtn"
  ).textContent =
    webMode
      ? "🌐 Web ON"
      : "🌐 Web OFF";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   FORMAT
========================= */

function formatAnswer(text){

  let safe =
    escapeHTML(text);


  safe =
    safe.replace(
      /```([\s\S]*?)```/g,
      "<pre style='overflow:auto;background:#080b0f;padding:10px;border-radius:10px'>$1</pre>"
    );


  safe =
    safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  return safe;

}


/* =========================
   RENDER HISTORY
========================= */

function renderHistory(){

  const chat =
    document.getElementById(
      "chat"
    );


  if(!history.length){

    return;

  }


  chat.innerHTML = "";


  history.forEach(
    (item,index) => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "message " +
        (
          item.role === "user"
            ? "user"
            : "ai"
        );


      div.innerHTML =
        formatAnswer(
          item.text || ""
        );


      if(
        item.role === "assistant"
      ){

        div.innerHTML += `

          <div class="msg-actions">

            <button
              onclick="speakText(${index})"
            >
              🔊 Speak
            </button>

            <button
              onclick="copyText(${index})"
            >
              📋 Copy
            </button>

            <button
              onclick="regenerate(${index})"
            >
              🔄 Regenerate
            </button>

          </div>

        `;

      }


      chat.appendChild(div);


      /*
       * Restore Action Card
       * after page reload.
       */

      if(
        item.role === "assistant" &&
        item.actionPlan &&
        item.actionPlan.requiresConfirmation === true
      ){

        showActionCard(
          item.actionPlan,
          index,
          true
        );

      }

    }
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   SAVE
========================= */

function saveHistory(){

  localStorage.setItem(
    CHAT_KEY,
    JSON.stringify(
      history.slice(-50)
    )
  );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedImage
  ){

    return;

  }


  const imageToSend =
    selectedImage;


  input.value = "";


  history.push({

    role:"user",

    text:
      text ||
      "Analyze this image."

  });


  saveHistory();

  renderHistory();


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "NiSa is thinking...";


  status.classList.remove(
    "hidden"
  );


  let answer =
    "Sorry, something went wrong.";


  let actionPlan =
    null;


  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                text ||
                "Analyze this image.",

              image:
                imageToSend,

              mode:
                document
                  .getElementById(
                    "mode"
                  )
                  .value,

              language:
                document
                  .getElementById(
                    "langSelect"
                  )
                  .value,

              memory,

              web:
                webMode,

              messages:
                history.slice(-12)

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Server error"
      );

    }


    answer =
      data.answer ||
      "No answer received.";


    actionPlan =
      data.actionPlan ||
      null;


  }catch(error){

    console.error(
      "NiSa error:",
      error
    );


    answer =
      "❌ NiSa error: " +
      error.message;

  }


  status.classList.add(
    "hidden"
  );


  const assistantIndex =
    history.length;


  history.push({

    role:"assistant",

    text:answer,

    actionPlan

  });


  saveHistory();

  renderHistory();


  /*
   * ACTION CARD
   */

  if(
    actionPlan &&
    actionPlan.requiresConfirmation === true
  ){

    /*
     * renderHistory() already restored
     * the card, so don't duplicate it.
     */

    const chat =
      document.getElementById(
        "chat"
      );

    /*
     * If needed, scroll to bottom.
     */

    chat.scrollTop =
      chat.scrollHeight;

  }


  /*
   * SPEAK
   */

  speak(answer);


  selectedImage =
    null;


  document.getElementById(
    "imagePreview"
  ).innerHTML = "";


  document.getElementById(
    "imageInput"
  ).value = "";

}
window.sendMessage = sendMessage;
window.startVoice = startVoice;
window.toggleTheme = toggleTheme;
window.toggleWeb = toggleWeb;
window.clearChat = clearChat;

/* =========================
   ACTION CARD
========================= */

function showActionCard(
  actionPlan,
  assistantIndex,
  restored = false
){

  const chat =
    document.getElementById(
      "chat"
    );


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "action-card";


  /*
   * Store complete action plan
   * directly on the card.
   */

  card._actionPlan =
    actionPlan;


  const description =
    actionPlan.description ||
    "NiSa wants to perform an action.";


  const action =
    actionPlan.action ||
    "unknown";


  let details = "";


  /* =========================
     TIMER DETAILS
  ========================== */

  if(
    action === "createTimer" &&
    actionPlan.params
  ){

    const seconds =
      Number(
        actionPlan.params.seconds || 0
      );


    const minutes =
      Math.floor(
        seconds / 60
      );


    const remainingSeconds =
      seconds % 60;


    if(minutes > 0){

      details =
        remainingSeconds > 0

          ? `⏱️ Timer: ${minutes} min ${remainingSeconds} sec`

          : `⏱️ Timer: ${minutes} min`;

    }else{

      details =
        `⏱️ Timer: ${remainingSeconds} sec`;

    }

  }


  /* =========================
     ALARM DETAILS
  ========================== */

  if(
    action === "setAlarm" &&
    actionPlan.params
  ){

    const hour =
      Number(
        actionPlan.params.hour
      );


    const minutes =
      Number(
        actionPlan.params.minutes
      );


    const time =
      `${String(hour).padStart(2,"0")}:${String(minutes).padStart(2,"0")}`;


    details =
      `⏰ Alarm: ${time}`;

  }


  /* =========================
     CARD HTML
  ========================== */

  card.innerHTML = `

    <div class="action-title">
      ⚡ Action Confirmation
    </div>


    <div class="action-description">
      ${formatAnswer(description)}
    </div>


    <div class="action-info">
      Action:
      ${escapeHTML(action)}
    </div>


    ${
      details
        ? `
          <div class="action-info">
            ${escapeHTML(details)}
          </div>
        `
        : ""
    }


    <div class="action-buttons">

      <button
        class="action-confirm"
        onclick="confirmAction(this)"
      >
        ✅ Confirm
      </button>


      <button
        class="action-cancel"
        onclick="cancelAction(this)"
      >
        ❌ Cancel
      </button>

    </div>


    <div class="action-info action-status">
      Waiting for confirmation...
    </div>

  `;


  chat.appendChild(
    card
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   ANDROID BRIDGE CHECK
========================= */

function androidBridgeAvailable(){

  return (
    window.AndroidBridge &&
    typeof window.AndroidBridge === "object"
  );

}


/* =========================
   CONFIRM ACTION
========================= */

function confirmAction(button){

  const card =
    button.closest(
      ".action-card"
    );


  if(!card){
    return;
  }


  const actionPlan =
    card._actionPlan;


  if(!actionPlan){

    card.innerHTML = `

      <div class="action-title">
        ❌ Action data missing
      </div>

      <div class="action-description">
        NiSa could not read the action details.
      </div>

    `;

    return;

  }


  const action =
    actionPlan.action;


  const params =
    actionPlan.params || {};


  try{

    /* =========================
       TIMER
    ========================== */

    if(
      action === "createTimer"
    ){

      const seconds =
        Number(
          params.seconds
        );


      const message =
        params.message ||
        "NiSa Timer";


      if(
        !Number.isInteger(seconds) ||
        seconds <= 0
      ){

        throw new Error(
          "Invalid timer duration."
        );

      }


      /*
       * Native Android App
       */

      if(
        androidBridgeAvailable() &&
        typeof
          window.AndroidBridge.setTimer ===
          "function"
      ){

        window.AndroidBridge.setTimer(
          message,
          seconds
        );


        card.innerHTML = `

          <div class="action-title">
            ✅ Timer Started
          </div>

          <div class="action-description">
            ${escapeHTML(
              actionPlan.description ||
              "Timer started."
            )}
          </div>

          <div class="action-info">
            Android Timer command sent.
          </div>

        `;


        return;

      }


      /*
       * Website mode
       */

      card.innerHTML = `

        <div class="action-title">
          ✅ Confirmed
        </div>

        <div class="action-description">
          ${escapeHTML(
            actionPlan.description ||
            "Action confirmed."
          )}
        </div>

        <div class="action-info">
          Android Bridge अजून connect केलेला नाही.
        </div>

      `;


      return;

    }


    /* =========================
       ALARM
    ========================== */

    if(
      action === "setAlarm"
    ){

      const hour =
        Number(
          params.hour
        );


      const minutes =
        Number(
          params.minutes
        );


      const message =
        params.message ||
        "NiSa Alarm";


      if(
        !Number.isInteger(hour) ||
        hour < 0 ||
