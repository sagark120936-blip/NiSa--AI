*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

:root{
  --bg:#0b0f14;
  --panel:#111720;
  --panel2:#171d24;
  --border:#29313b;
  --text:#fff;
  --muted:#9aa4b2;
  --accent:#4d8cff;
  --user:#2563eb;
}

body{
  background:var(--bg);
  color:var(--text);
  height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  border-radius:12px;
  cursor:pointer;
}

.app{
  max-width:900px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================== */

header{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg);
  position:relative;
}

.logo{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  flex:none;
}

.title{
  flex:1;
}

.title h1{
  font-size:20px;
}

.title p{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.icon-btn{
  background:var(--panel2);
  color:#fff;
  padding:9px 11px;
  border:1px solid var(--border);
}

/* =========================
   CHAT
========================== */

#chat{
  flex:1;
  overflow-y:auto;
  padding:18px;
}

.welcome{
  margin-bottom:22px;
}

.welcome h2{
  font-size:26px;
  margin-bottom:7px;
}

.welcome p{
  color:var(--muted);
}

.message{
  max-width:88%;
  padding:13px 14px;
  border-radius:16px;
  margin-bottom:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.ai{
  background:var(--panel2);
  border:1px solid var(--border);
  margin-right:auto;
}

.user{
  background:var(--user);
  margin-left:auto;
}

.msg-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
  flex-wrap:wrap;
}

.msg-actions button,
.mini{
  background:#202833;
  color:#dce5f2;
  padding:6px 9px;
  font-size:12px;
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
}

.confidence{
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
}

.preview{
  max-width:220px;
  max-height:180px;
  border-radius:12px;
  margin-bottom:8px;
  display:block;
}

/* =========================
   ACTION PLANNER
========================== */

.action-card{
  margin-top:12px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#0d131b;
}

.action-title{
  font-weight:bold;
  margin-bottom:7px;
}

.action-description{
  color:#dce5f2;
  font-size:14px;
}

.action-buttons{
  display:flex;
  gap:8px;
  margin-top:11px;
  flex-wrap:wrap;
}

.action-buttons button{
  padding:8px 13px;
  border-radius:10px;
  color:#fff;
}

.action-confirm{
  background:#2563eb!important;
}

.action-cancel{
  background:#3a2020!important;
}

.action-info{
  color:var(--muted);
  font-size:11px;
  margin-top:8px;
}

/* =========================
   INPUT
========================== */

.input-area{
  padding:10px;
  border-top:1px solid var(--border);
  background:var(--bg);
}

.toolbar{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:8px;
}

.toolbar button,
.toolbar select{
  background:var(--panel2);
  color:#fff;
  border:1px solid var(--border);
  padding:8px 9px;
  border-radius:10px;
  white-space:nowrap;
}

.composer{
  display:flex;
  gap:8px;
}

.composer input{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:14px;
  border:1px solid #303944;
  background:#151a20;
  color:#fff;
  outline:none;
}

.composer input:focus{
  border-color:var(--accent);
}
