<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NiSa AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      max-width: 800px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #252b33;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0d1117;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .header-info h1 {
      font-size: 21px;
    }

    .header-info p {
      color: #8c96a3;
      font-size: 12px;
      margin-top: 3px;
    }

    .header-buttons {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      border: 1px solid #303741;
      background: #151a20;
      color: white;
      border-radius: 10px;
      padding: 9px 11px;
      cursor: pointer;
      font-size: 14px;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* CHAT */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 5px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #303741;
      border-radius: 10px;
    }

    .message {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      max-width: 88%;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ai {
      background: #171d25;
      border: 1px solid #252d38;
      margin-right: auto;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .ai {
      border-bottom-left-radius: 5px;
    }

    /* TYPING */
    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      height: 18px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #9aa4b2;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    /* INPUT */
    .input-area {
      padding: 14px 18px 18px;
      border-top: 1px solid #252b33;
      background: #0d1117;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #303944;
      background: #151a20;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #4b5563;
    }

    input::placeholder {
      color: #737d89;
    }

    #sendBtn {
      min-width: 75px;
      border: none;
      border-radius: 14px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    #sendBtn:active {
      transform: scale(0.96);
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .app {
        width: 100%;
      }

      header {
        padding: 14px 16px;
      }

      .header-info h1 {
        font-size: 19px;
      }

      .message {
        max-width: 92%;
        font-size: 15px;
      }

      #chat {
        padding: 18px 14px;
      }

      .input-area {
        padding: 12px;
      }

      #sendBtn {
        min-width: 70px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">N</div>

    <div class="header-info">
      <h1>NiSa AI</h1>
      <p>Your personal AI assistant</p>
    </div>

    <div class="header-buttons">
      <button class="icon-btn" onclick="clearChat()" title="Clear chat">
        🗑️
      </button>
    </div>
  </header>


  <!-- CHAT -->
  <div id="chat">

    <div class="message ai">
      👋 Hello! I'm <b>NiSa AI</b>.<br><br>
      How can I help you today?
    </div>

  </div>


  <!-- INPUT -->
  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Message NiSa AI..."
      autocomplete="off"
      onkeydown="handleKey(event)"
    >

    <button id="sendBtn" onclick="sendMessage()">
      Send
    </button>

  </div>

</div>


<script>

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");
  const sendBtn = document.getElementById("sendBtn");


  // ENTER KEY
  function handleKey(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  }


  // SCROLL TO BOTTOM
  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }


  // ADD MESSAGE
  function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.innerHTML = text;

    chat.appendChild(message);

    scrollBottom();

    return message;
  }


  // ESCAPE HTML
  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  // SEND MESSAGE
  async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;


    // USER MESSAGE
    addMessage(escapeHTML(text), "user");

    input.value = "";

    sendBtn.disabled = true;


    // TYPING MESSAGE
    const aiMessage = document.createElement("div");

    aiMessage.className = "message ai";

    aiMessage.innerHTML = `
      <div class="typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    `;

    chat.appendChild(aiMessage);

    scrollBottom();


    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: text
        })

      });


      const data = await response.json();


      if (response.ok) {

        aiMessage.textContent =
          data.answer || "Sorry, I couldn't generate an answer.";

      } else {

        aiMessage.textContent =
          "⚠️ " + (data.error || "Something went wrong.");

      }


    } catch (error) {

      aiMessage.textContent =
        "⚠️ Connection error. Please try again.";

    }


    sendBtn.disabled = false;

    input.focus();

    scrollBottom();

  }


  // CLEAR CHAT
  function clearChat() {

    chat.innerHTML = `
      <div class="message ai">
        👋 Hello! I'm <b>NiSa AI</b>.<br><br>
        How can I help you today?
      </div>
    `;

  }


  // AUTO FOCUS
  input.focus();

</script>

</body>
</html>
